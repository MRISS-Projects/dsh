name: Staging

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'RC branch name (e.g. staging-0.3.0-SNAPSHOT-RC)'
        required: true

jobs:
  staging:
    uses: MRISS-Projects/parent-poms/.github/workflows/project-staging.yml@master
    with:
      git_project: dsh
      branch_name: ${{ inputs.branch_name }}
      # #114: the build's Mongo settings, which dsh-data's mongo.properties is filtered from.
      # Without them every dsh-rest-api context fails on an unresolved placeholder. No MongoDB
      # runs behind them: parent-poms#78 removed the service containers, and no test connects.
      maven_properties: |
        mongo.host=localhost
        mongo.port=27017
        mongo.user=dshuser
        mongo.password=dshpass
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
