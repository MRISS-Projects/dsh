name: Hotfix

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Hotfix branch (e.g. 0.3.x)'
        required: true

jobs:
  hotfix:
    uses: MRISS-Projects/parent-poms/.github/workflows/project-hotfix.yml@master
    with:
      git_project: dsh
      branch_name: ${{ inputs.branch_name }}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
