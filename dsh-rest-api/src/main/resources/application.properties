# Maven filters this file with the at-sign delimiter only (#158). So ${project.version} reaches
# the jar as written, for Spring to resolve, while @project.version@ is replaced by the version
# this jar was built from. ClasspathResourceFilteringTest fails if either one changes.

# Document store (ADR-003, section 3). dsh.persistence selects it; absent means memory, its only
# value until Wave 5. Any other value stops the startup.

# Actuator – expose health endpoint
management.endpoints.web.exposure.include=health,info

# Disable Solr health check (Solr may not be available in all environments)
management.health.solr.enabled=false

# Springfox 3.0.0 compatibility with Spring Boot 2.6+ (changed default path-matching strategy)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Allow WebMvcRequestHandlerProvider override (Springfox 3.0.0 + Spring Boot 2.6+ fix)
spring.main.allow-bean-definition-overriding=true

