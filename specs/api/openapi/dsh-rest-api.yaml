openapi: 3.0.3
info:
  title: DSH REST API
  description: |
    The API that `dsh-rest-api` serves today: the two operations of `DocumentResource`, with the
    responses a running application returns. An API change starts here, as
    `.github/copilot/rules/api-standards.md` asks ("OpenAPI First").

    **Departures from `api-standards.md`.** The API does not meet that standard yet, and this
    document says where:

    - Paths are under `/v1/dsh/document`, not `/api/v1`, and name actions (`submit`) rather than
      resources. No issue plans a change.
    - A failure the controller handles answers `200`, with the failure in the body: a rejected
      submission and an unknown token. `#138` plans the `4xx` codes.
    - No request is authenticated, so each operation declares `security: []`. No issue plans
      authentication.
    - Errors that reach Spring Boot answer its default error body (`ErrorBody`), not the error body
      the standard describes.
    - The standard says never to expose internal error details, but a rejected submission's
      `message` carries the caught exception's own message. No issue plans a change: `#138`
      changes the status codes, not the message.

    **Outside this document.** `/actuator/health` and `/actuator/info` exist, served by Spring Boot
    Actuator. They are not `DocumentResource`'s, and `#45` owns them.

    **Feature specifications:**

    - `specs/features/rest-api-endpoints.md`
    - `specs/features/document-analysis.md`
    - `specs/features/indexing-workflow.md`
    - `specs/features/smart-highlighting.md`
  version: 1.0.0
  contact:
    name: MRISS Projects
    url: https://github.com/MRISS-Projects/dsh

servers:
  - url: http://localhost:8080
    description: A local run of `dsh-rest-api`, which sets no port and no context path

tags:
  - name: documents
    description: Submitting a document and reading its status

paths:
  /v1/dsh/document/submit:
    post:
      tags:
        - documents
      summary: Submit a document for processing
      operationId: submitDocument
      security: []
      description: |
        Stores a document and queues it for processing, and answers with the token that identifies
        it.

        A non-blank title must be supplied either as the `title` query parameter or as a multipart
        `title` part. OpenAPI 3.0 cannot enforce this requirement across locations.

        - **`/submit` does not wait for the store or the enqueue.** Both run asynchronously and
          race the response, so `/status` can answer `TOKEN_NOT_FOUND` for a moment (from the
          code; a live run never saw it in 20 tries), and a store that cannot be reached does not
          fail the submission. Wave 2 task 1 (`specs/product/PRD.md`) changes this.
        - **Every submission gets a new token**, the same file included.
        - **The token is opaque** to a client.
        - **A rejected submission answers `200`**, with `token` `ERROR` and the reason in
          `message`: a blank title, or any exception the controller catches (`#138`).
        - **The file's type is not checked.** Its size is bounded by Spring Boot's multipart
          defaults, which the application does not change: 1 MB per file and 10 MB per request.
          A larger upload answers `500`.

        See `specs/features/rest-api-endpoints.md` and `specs/features/document-analysis.md`.
      parameters:
        - name: title
          in: query
          required: false
          description: The document's title; must not be blank when supplied.
          schema:
            type: string
          example: A title
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - contents
              properties:
                title:
                  type: string
                  description: The document's title; must not be blank when supplied.
                  example: A title
                contents:
                  type: string
                  format: binary
                  description: The document's file, of any type, at most 1 MB.
      responses:
        '200':
          description: |
            The submission was accepted and `token` identifies the document, or it was rejected and
            `token` is `ERROR` with the reason in `message` (`#138`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
              examples:
                accepted:
                  summary: Accepted
                  value:
                    token: 2026101461d279be-cc9e-40f3-a373-cd3fdabdcdf7
                    message: ''
                blankTitle:
                  summary: Rejected, the title is blank
                  value:
                    token: ERROR
                    message: "Error submitting file: Document title and contents can't be null."
        '400':
          description: |
            A part is missing, or the request is not `multipart/form-data`. Spring rejects it before
            the controller runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                timestamp: '2026-10-14T16:10:01.339+00:00'
                status: 400
                error: Bad Request
                path: /v1/dsh/document/submit
        '500':
          description: |
            The file is larger than 1 MB, or the request larger than 10 MB: Spring Boot's multipart
            defaults. The upload is rejected before the controller runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                timestamp: '2026-10-14T18:07:11.607+00:00'
                status: 500
                error: Internal Server Error
                path: /v1/dsh/document/submit

  /v1/dsh/document/status/{token}:
    get:
      tags:
        - documents
      summary: Get a document's status
      operationId: getDocumentStatus
      security: []
      description: |
        Answers the status of the document a token identifies, and the status's message.

        - **An unknown token answers `200`**, with `status` `TOKEN_NOT_FOUND` (`#138`).
        - **A store that cannot be reached answers `500`**, after the store client's own timeout of
          about 30 seconds.

        See `specs/features/rest-api-endpoints.md` and `specs/features/indexing-workflow.md`.
      parameters:
        - name: token
          in: path
          required: true
          description: The token `/submit` returned.
          schema:
            type: string
          example: 2026101461d279be-cc9e-40f3-a373-cd3fdabdcdf7
      responses:
        '200':
          description: |
            The document's status, or `TOKEN_NOT_FOUND` when no document has the token (`#138`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusDto'
              examples:
                known:
                  summary: A known token
                  value:
                    status: QUEUED_FOR_INDEXING_SUCCESS
                    message: Document id successfuly queued for indexing.
                tokenNotFound:
                  summary: An unknown token
                  value:
                    status: TOKEN_NOT_FOUND
                    message: 'No token was found with the contents: no-such-token'
        '500':
          description: The document store cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                timestamp: '2026-10-14T16:10:43.987+00:00'
                status: 500
                error: Internal Server Error
                path: /v1/dsh/document/status/2026101461d279be-cc9e-40f3-a373-cd3fdabdcdf7

components:
  schemas:
    TokenDto:
      type: object
      description: The answer to a submission.
      properties:
        token:
          type: string
          description: The document's token, or `ERROR` when the submission failed.
        message:
          type: string
          description: Empty on success; the reason on failure.

    DocumentStatusDto:
      type: object
      description: The answer to a status request.
      properties:
        status:
          type: string
          description: |
            `DocumentStatus`'s description (`dsh-data`), which is the status's name except for
            `NOT_INDEXED_ERROR` (Wave 1 task 12). The statuses and their transitions are listed in
            `specs/architecture/document-status-workflow.md`. Or `TOKEN_NOT_FOUND`, when no document
            has the token.
        message:
          type: string
          description: The status's message, or the reason the token was not found.

    ErrorBody:
      type: object
      description: |
        Spring Boot's default error attributes, for a request that fails before or outside the
        controller's own handling.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error happened.
        status:
          type: integer
          description: The HTTP status code.
        error:
          type: string
          description: The HTTP status's reason phrase.
        path:
          type: string
          description: The request's path.
